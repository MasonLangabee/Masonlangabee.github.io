<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connected</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}code{background:#f2f2f2;padding:2px 6px;border-radius:4px;word-break:break-all}</style></head><body>
<h1 id="h">Almost done</h1><div id="out"></div>
<script>
var p=new URLSearchParams(location.search),o=document.getElementById('out');
if(p.get('code')){o.innerHTML='<p>The connection was approved. Copy the code below and paste it back to Claude in your chat. It expires in a few minutes.</p><p><code id="c"></code></p><button id="b">Copy code</button>';
document.getElementById('c').textContent=p.get('code');
document.getElementById('b').onclick=function(){navigator.clipboard.writeText(p.get('code'));this.textContent='Copied';};}
else if(p.get('error')){document.getElementById('h').textContent='Not connected';o.textContent='The app said: '+(p.get('error_description')||p.get('error'));}
else{o.textContent='This page finishes connecting your account (TikTok or YouTube). Nothing to do here yet.';}
</script></body></html>
